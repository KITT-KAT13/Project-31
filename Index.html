<!DOCTYPE html>
<html>

<head>
    <title>My Restaurant</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Navigation */
        .navbar {
            background-color: lightgray;
            padding: 10px;
        }

        .navbar a {
            margin: 0 10px;
            text-decoration: none;
            color: black;
        }

        /* Sections */
        section {
            padding: 40px;
            border-bottom: 1px solid #ddd;
        }

        h1,
        h2 {
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <div class="navbar">
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#menu">Menu</a>
        <a href="#gallery">Food Gallery</a>
        <a href="#contact">Contact</a>
    </div>

    <!-- Sections -->
    <section id="home">
        <h1>Welcome to My Restaurant</h1>
        <p>This is the home page of my restaurant website.</p>
    </section>

    <section id="about">
        <h2>About</h2>
        <p>My restaurant serves good food and drinks.</p>
    </section>

    <section id="menu">
        <h2>Menu</h2>
        <p>Here you can find our food items.</p>
    </section>

    <section id="gallery">
        <h2>Food Gallery</h2>
        <p>Pictures of our food will go here.</p>
    </section>

    <section id="contact">
        <h2>Contact</h2>
        <p>Email: myrestaurant@email.com</p>
    </section>

</body>

</html>
